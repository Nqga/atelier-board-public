# Use from the project root together with docker-compose.yml (Compose >= 2.24.4).
services:
  atelier:
    # The application is reachable only by Caddy on the Compose network.
    ports: !reset []
    environment:
      PUBLIC_URL: https://${DOMAIN:?Définissez DOMAIN dans .env.production}
      TRUST_PROXY: "1"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    depends_on:
      atelier:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Définissez DOMAIN dans .env.production}
      # Preserve configured proxy exclusions and bypass proxies for our backend.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},atelier
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1},${no_proxy:-localhost,127.0.0.1},atelier
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
