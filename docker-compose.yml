services:
  atelier:
    image: atelier-board:2.2.0
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MAX_BOARDS_PER_GUEST: ${MAX_BOARDS_PER_GUEST:-20}
      MAX_BOARD_STORAGE_MB: ${MAX_BOARD_STORAGE_MB:-100}
      MAX_TOTAL_STORAGE_MB: ${MAX_TOTAL_STORAGE_MB:-1024}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-500}
      MAX_CONNECTIONS_PER_BOARD: ${MAX_CONNECTIONS_PER_BOARD:-50}
      MAX_CONNECTIONS_PER_USER: ${MAX_CONNECTIONS_PER_USER:-12}
      MAX_ACTIVE_BOARDS: ${MAX_ACTIVE_BOARDS:-100}
      MAX_IDLE_BOARDS: ${MAX_IDLE_BOARDS:-100}
      SESSION_CREATIONS_PER_MINUTE: ${SESSION_CREATIONS_PER_MINUTE:-120}
      INVITATION_JOINS_PER_MINUTE: ${INVITATION_JOINS_PER_MINUTE:-300}
      WEBSOCKET_CONNECTIONS_PER_MINUTE: ${WEBSOCKET_CONNECTIONS_PER_MINUTE:-300}
    volumes:
      - atelier-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(4000)}).then(async r => {if (!r.ok || (await r.json()).status !== 'ok') process.exit(1);}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  atelier-data:
