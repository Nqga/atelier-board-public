services:
  atelier:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      DATA_DIR: /data
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - atelier-data:/data

volumes:
  atelier-data:
